<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist do Trabalho Prático de Java OO</title>
    
    <!-- Tailwind CSS para estilização moderna e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Configurações personalizadas do Tailwind para a fonte -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Animações suaves para o accordion */
        .accordion-content {
            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        .accordion-content.open {
            max-height: 1000px; /* Um valor alto o suficiente para caber o conteúdo */
            opacity: 1;
        }
        
        /* Estilização customizada da checkbox */
        .custom-checkbox {
            appearance: none;
            background-color: #fff;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.5em;
            height: 1.5em;
            border: 2px solid #cbd5e1;
            border-radius: 0.35em;
            display: grid;
            place-content: center;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }

        .custom-checkbox::before {
            content: "";
            width: 0.8em;
            height: 0.8em;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
            transform: scale(0);
            transform-origin: bottom left;
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            background-color: white;
        }

        .custom-checkbox:checked {
            background-color: #2563eb;
            border-color: #2563eb;
        }

        .custom-checkbox:checked::before {
            transform: scale(1);
        }

        .custom-checkbox:focus {
            outline: max(2px, 0.15em) solid #93c5fd;
            outline-offset: max(2px, 0.15em);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8">

    <main class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col">
        
        <!-- Header Principal -->
        <header class="bg-gradient-to-r from-brand-600 to-brand-900 text-white p-6 md:p-8">
            <h1 class="text-2xl md:text-3xl font-bold mb-2">Checklist do Trabalho Prático de Java OO</h1>
            <p class="text-brand-100 mb-6">Acompanhe seu progresso na implementação das partes 1 e 2.</p>
            
            <!-- Barra de progresso geral -->
            <div class="space-y-2">
                <div class="flex justify-between text-sm font-medium">
                    <span>Progresso Total</span>
                    <span id="progress-text">0%</span>
                </div>
                <div class="w-full bg-brand-900/50 rounded-full h-2.5">
                    <div id="progress-bar" class="bg-white h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </header>

        <!-- Container para as Seções do Checklist -->
        <div id="checklist-container" class="p-6 md:p-8 space-y-4">
            <!-- O conteúdo será injetado aqui via JavaScript -->
        </div>
        
        <!-- Rodapé -->
        <footer class="bg-slate-50 border-t border-slate-200 p-4 text-center">
            <button onclick="resetProgress()" class="text-sm text-slate-500 hover:text-red-600 transition font-medium flex items-center justify-center w-full">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                Zerar Progresso
            </button>
        </footer>
    </main>

    <script>
        // Estrutura de dados com os requisitos do trabalho
        const checklistData = [
            {
                id: 'sec-1',
                title: "Seção 1: Estrutura Base (Parte 2)",
                tasks: [
                    { id: 't1-1', text: "Criar a interface <code class='bg-slate-100 text-brand-600 px-1 rounded text-sm'>Payable</code>." },
                    { id: 't1-2', text: "Criar a classe <code class='bg-slate-100 text-brand-600 px-1 rounded text-sm'>Invoice</code> implementando a interface <code class='bg-slate-100 text-brand-600 px-1 rounded text-sm'>Payable</code>." },
                    { id: 't1-3', text: "Criar a classe abstrata <code class='bg-slate-100 text-brand-600 px-1 rounded text-sm'>Employee</code> implementando a interface <code class='bg-slate-100 text-brand-600 px-1 rounded text-sm'>Payable</code> (esta será a superclasse dos funcionários)." }
                ]
            },
            {
                id: 'sec-2',
                title: "Seção 2: Tipos de Funcionários e Herança (Parte 1)",
                tasks: [
                    { id: 't2-1', text: "Criar a subclasse <code class='bg-slate-100 text-brand-600 px-1 rounded text-sm'>SalariedEmployee</code> (recebem salários fixos semanais)." },
                    { id: 't2-2', text: "Criar subclasse para <strong>funcionários horistas</strong> (recebem por hora normal e 1,5x a taxa para horas excedentes a 40 horas semanais)." },
                    { id: 't2-3', text: "Criar subclasse para <strong>funcionários comissionados</strong> (recebem porcentagem sobre vendas)." },
                    { id: 't2-4', text: "Criar subclasse para <strong>funcionários assalariados/comissionados</strong> (recebem salário-base + porcentagem sobre vendas)." }
                ]
            },
            {
                id: 'sec-3',
                title: "Seção 3: Regras de Negócio e Polimorfismo",
                tasks: [
                    { id: 't3-1', text: "Implementar o aplicativo que processa e calcula a folha de pagamentos <strong>polimorficamente</strong>." },
                    { id: 't3-2', text: "Adicionar lógica para recompensar os <strong>funcionários assalariados/comissionados</strong> com 10% a mais no salário-base durante o período salarial atual." }
                ]
            },
            {
                id: 'sec-4',
                title: "Seção 4: Tratamento de Exceções e Legislação Trabalhista",
                tasks: [
                    { id: 't4-1', text: "Criar uma classe de exceção personalizada do tipo <em>checked</em> (estendendo <code class='bg-slate-100 text-brand-600 px-1 rounded text-sm'>Exception</code>) para limite de horas extras." },
                    { id: 't4-2', text: "Implementar a validação e <strong>lançar a exceção</strong> sempre que um colaborador fizer mais de duas horas extras diárias." },
                    { id: 't4-3', text: "Adicionar lógica para marcar/sinalizar na folha de pagamentos todos os pagamentos gerados com essas horas extras excessivas, evidenciando possíveis problemas trabalhistas." }
                ]
            }
        ];

        // Carrega o progresso salvo ou inicia vazio
        let savedState = JSON.parse(localStorage.getItem('javaOOP_progress')) || {};

        function renderChecklist() {
            const container = document.getElementById('checklist-container');
            container.innerHTML = ''; // Limpa o container
            
            checklistData.forEach((section, index) => {
                // Estado da seção (aberta por padrão na primeira visita)
                const isOpen = index === 0; 
                
                const sectionHTML = `
                    <div class="border border-slate-200 rounded-xl overflow-hidden bg-white shadow-sm transition-all duration-300">
                        <!-- Cabeçalho da Seção (Accordion Toggle) -->
                        <button onclick="toggleAccordion('${section.id}')" 
                                class="w-full flex justify-between items-center p-4 bg-slate-50 hover:bg-slate-100 transition-colors focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-inset">
                            <h2 class="text-lg font-semibold text-slate-800 text-left">${section.title}</h2>
                            <svg id="icon-${section.id}" class="w-5 h-5 text-slate-500 transform transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                        
                        <!-- Lista de Tarefas -->
                        <div id="content-${section.id}" class="accordion-content ${isOpen ? 'open' : ''}">
                            <div class="p-2">
                                ${section.tasks.map(task => {
                                    const isChecked = savedState[task.id] === true;
                                    return `
                                        <label class="flex items-start space-x-3 p-3 hover:bg-slate-50 cursor-pointer rounded-lg transition-colors group">
                                            <div class="flex-shrink-0 mt-0.5">
                                                <input type="checkbox" 
                                                    id="${task.id}" 
                                                    class="custom-checkbox"
                                                    ${isChecked ? 'checked' : ''} 
                                                    onchange="toggleTask('${task.id}')">
                                            </div>
                                            <span id="text-${task.id}" class="text-slate-700 leading-relaxed transition-all duration-300 ${isChecked ? 'line-through text-slate-400 opacity-60' : 'group-hover:text-slate-900'}">
                                                ${task.text}
                                            </span>
                                        </label>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += sectionHTML;
            });

            updateProgress();
        }

        // Alterna o estado de uma tarefa
        function toggleTask(taskId) {
            const checkbox = document.getElementById(taskId);
            const textSpan = document.getElementById(`text-${taskId}`);
            
            // Atualiza o estado
            savedState[taskId] = checkbox.checked;
            
            // Atualiza o estilo visual (riscado)
            if (checkbox.checked) {
                textSpan.classList.add('line-through', 'text-slate-400', 'opacity-60');
                textSpan.classList.remove('group-hover:text-slate-900');
            } else {
                textSpan.classList.remove('line-through', 'text-slate-400', 'opacity-60');
                textSpan.classList.add('group-hover:text-slate-900');
            }
            
            // Salva no LocalStorage
            localStorage.setItem('javaOOP_progress', JSON.stringify(savedState));
            
            // Atualiza a barra
            updateProgress();
        }

        // Alterna o acordeão (abrir/fechar seção)
        window.toggleAccordion = function(sectionId) {
            const content = document.getElementById(`content-${sectionId}`);
            const icon = document.getElementById(`icon-${sectionId}`);
            
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                icon.classList.remove('rotate-180');
            } else {
                content.classList.add('open');
                icon.classList.add('rotate-180');
            }
        };

        // Calcula e atualiza a barra de progresso no cabeçalho
        function updateProgress() {
            let totalTasks = 0;
            let completedTasks = 0;

            checklistData.forEach(section => {
                section.tasks.forEach(task => {
                    totalTasks++;
                    if (savedState[task.id]) {
                        completedTasks++;
                    }
                });
            });

            const percentage = totalTasks === 0 ? 0 : Math.round((completedTasks / totalTasks) * 100);
            
            document.getElementById('progress-bar').style.width = `${percentage}%`;
            document.getElementById('progress-text').innerText = `${percentage}%`;
        }

        // Zera o progresso apagando tudo
        window.resetProgress = function() {
            if(confirm("Tem certeza que deseja zerar o checklist? O progresso será perdido.")) {
                savedState = {};
                localStorage.removeItem('javaOOP_progress');
                renderChecklist();
            }
        }

        // Inicializa o aplicativo assim que carregar a página
        window.onload = renderChecklist;

    </script>
</body>
</html>
